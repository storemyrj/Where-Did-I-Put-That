name: Apply D1 migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "drizzle/**"

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Wrangler configuration
        run: pnpm run build

      - name: Prepare migration files for Wrangler
        run: mkdir -p dist/server/drizzle && cp -R drizzle/. dist/server/drizzle/

      - name: Apply remote D1 migrations
        run: pnpm exec wrangler d1 migrations apply site-creator-d1 --remote --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
